name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    # windows-latest, e não ubuntu, porque este é um app de Windows: Baixador.bat,
    # os.startfile, sanitização dos nomes reservados do DOS, limite de 260
    # caracteres de caminho e comparação de pasta ignorando caixa. Rodar no Linux
    # reprovava três testes que estão corretos — o runner é que era a plataforma
    # errada.
    name: Testes — Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      # Sem fail-fast: se a 3.12 quebrar, ainda quero ver o resultado da 3.13.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # tests/test_ffmpeg.py tem um teste com skipif que só roda quando o binário
      # existe no PATH. Sem este passo ele seria PULADO em silêncio e a CI ficaria
      # verde sem ter verificado a detecção de verdade.
      - name: Instalar ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes
        run: python -m pytest tests/ -q

  qualidade:
    # Este job fica no ubuntu de propósito: o ruff não depende de sistema, o
    # .gitattributes fixa `eol=lf`, então os arquivos chegam byte a byte iguais
    # nos dois — e o runner Linux é mais rápido e mais barato.
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Só o ruff: este job não roda teste, não precisa de ffmpeg nem do yt-dlp.
      - name: Instalar ruff
        run: python -m pip install ruff==0.16.6

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

  testes-3-14:
    # A versão que roda na máquina do autor. Fora da matriz e com
    # continue-on-error porque é a mais nova. Na primeira execução ela já
    # encontrou uma condição de corrida real em src/storage/historico.py, com 20
    # threads gravando no SQLite — um bug que a máquina local não pegava. Sobe
    # para a matriz de cima quando passar de forma estável.
    name: Testes — Python 3.14 (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes
        run: python -m pytest tests/ -q
