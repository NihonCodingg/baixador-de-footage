# Perfis de qualidade voltados para edição.
# Justificativa técnica de cada seletor: RESEARCH.md 2.2 e SPEC.md 6.
#
# format      = filtro ELIMINATÓRIO (o que é inegociável)
# format_sort = ordem de PREFERÊNCIA (nunca elimina, só decide o melhor)
#
# ---------------------------------------------------------------------------
# O PLACEHOLDER {dim}
# ---------------------------------------------------------------------------
# O teto de qualidade é aplicado na MENOR dimensão do vídeo, não na altura.
# Vídeo horizontal tem a altura como menor dimensão; vertical tem a largura.
# Um filtro fixo [height<=1080] entrega 480x854 num Short — medido, SPEC 6.3.
#
# A gramática do yt-dlp não tem operador OR, então não dá para escrever
# "height<=1080 ou width<=1080" num filtro só. A solução é resolver o campo em
# tempo de execução, a partir da orientação que já conhecemos da inspeção.
#
# {dim} é substituído por "[height<=N]", "[width<=N]" ou "" (vazio, quando o
# vídeo não tem formatos com dimensão — conteúdo só de áudio).
# O N vem de `limite_dimensao`.
#
# PROIBIDO usar `,` no format: gera vários arquivos e quebra a premissa de
# um arquivo por job. A carga rejeita.

perfis:

  edicao_1080:
    descricao: "1080p H.264 + AAC — abre nativo no Premiere/Resolve"
    limite_dimensao: 1080
    format: "bv*{dim}[vcodec^=avc1]+ba[acodec^=mp4a]/bv*{dim}+ba/b{dim}/b"
    format_sort: ["res:1080", "vcodec:h264", "acodec:aac", "fps"]
    merge_output_format: "mp4"
    postprocessors: []
    exige_ffmpeg: true

  edicao_4k:
    descricao: "Até 2160p — VP9/AV1, pode exigir transcode para a timeline"
    limite_dimensao: 2160
    # NÃO filtra por avc1: o YouTube não serve H.264 acima de 1080p.
    # Um filtro de codec aqui faria o perfil cair em silêncio para 1080p.
    format: "bv*{dim}+ba/b{dim}/b"
    format_sort: ["res:2160", "fps", "vcodec:vp9", "acodec:aac"]
    # mkv aceita qualquer combinação de codecs sem atrito.
    merge_output_format: "mkv"
    postprocessors: []
    exige_ffmpeg: true

  maxima:
    descricao: "O melhor que o site tiver, sem teto — VP9/AV1, pode exigir transcode"
    # SEM TETO: nenhum {dim}, e por isso limite_dimensao é null (a carga
    # recusa um format com {dim} e limite null, e vice-versa).
    # Use quando o que importa é pegar o máximo, inclusive acima de 2160p.
    limite_dimensao: null
    format: "bv*+ba/b"
    # `res` no yt-dlp é a MENOR dimensão — a mesma medida do teto dos outros
    # perfis (SPEC 6.3). Sem valor, ordena da maior para a menor.
    format_sort: ["res", "fps", "vcodec:vp9", "acodec:aac"]
    # mkv pelo mesmo motivo do edicao_4k: acima de 1080p só existe VP9/AV1,
    # e o mkv aceita qualquer combinação sem atrito.
    merge_output_format: "mkv"
    postprocessors: []
    exige_ffmpeg: true

  so_audio:
    descricao: "Só a trilha de áudio, em m4a"
    limite_dimensao: null          # não usa dimensão
    format: "ba/b"
    format_sort: ["acodec:aac", "abr"]
    merge_output_format: "m4a"
    # m4a e não mp3: o YouTube já entrega AAC ou Opus. Converter para MP3 é
    # uma segunda geração de perda sem ganho. Com m4a e fonte AAC, o ffmpeg
    # faz copy do stream, sem reencodar.
    postprocessors:
      - key: "FFmpegExtractAudio"
        preferredcodec: "m4a"
        preferredquality: "0"
    exige_ffmpeg: true

  preview_leve:
    descricao: "Até 480p, menor arquivo — para bater o olho antes de baixar"
    limite_dimensao: 480
    format: "bv*{dim}+ba/b{dim}/b"
    # O `+` inverte a ordenação: prefere o MENOR arquivo.
    # Melhor que `worst`, que escolhe o pior em todos os aspectos.
    format_sort: ["res:480", "+size"]
    merge_output_format: "mp4"
    postprocessors: []
    exige_ffmpeg: true
